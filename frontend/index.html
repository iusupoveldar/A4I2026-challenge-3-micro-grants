    :root {

      --card: #ffffff;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -20; }
    }
    .edge-animated {
      animation: dashFlow 1.2s linear infinite;
    }
  </style>

        <span class="font-bold text-sm text-slate-900">SF OEWD Grant Officer Console</span>
        <span class="text-slate-300">|</span>
        <span class="text-xs text-slate-500">Central Market · $50,000 Tranche</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        onclick="selectEntity('PORTFOLIO_MEMO')"

        ADK Live · 232 Nodes

    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">

    <!-- =================================================================== -->
    <aside

    >
      <!-- Search Bar + Collapse Button -->
      <div class="p-3 border-b border-slate-200 flex items-center gap-2">
        <input
          id="applicant-search"
          type="text"
          oninput="handleSearch(event)"
          placeholder="Search business, NAICS..."
          class="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:bg-white focus:border-slate-400"
        />

          onclick="toggleSidebar()"
          title="Minimize Sidebar"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 text-xs"
        >
          ✕
        </button>
      </div>

      <!-- Scrollable Applicant List -->
      <div id="applicant-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-1.5 space-y-0.5">
        <!-- Populated by JS -->
      </div>

      <!-- Compact Sidebar Footer -->
      <div class="px-3 py-2 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs text-slate-500">
        <span>7 Funded · 2 Bottlenecks</span>
        <span class="font-mono font-semibold text-slate-700">$50,000</span>
      </div>
    </aside>

    <!-- =================================================================== -->
    <!-- 2. MAIN COLUMN: TOP = CONCISE INFO & CASCADE | BOTTOM = ADK CHAT    -->
    <!-- =================================================================== -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">

      <!-- TOP PANE (62% height): Concise Information & Cascade Canvas -->
      <section class="h-[62%] overflow-y-auto p-5 border-b border-slate-200">
        <div id="info-canvas" class="max-w-6xl mx-auto h-full">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- BOTTOM PANE (38% height): Docked ADK Chat Window -->
      <section class="h-[38%] bg-white flex flex-col overflow-hidden shrink-0">
        <!-- Minimal Chat Bar Header -->
        <div class="px-5 py-2 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="text-xs font-bold text-slate-800">ADK Economist Co-Pilot</span>

          </div>
          <span class="text-xs font-mono text-slate-500" id="active-agent-badge">Active: Orchestrator</span>
        </div>

        <!-- Scrollable Chat Messages -->
        <div id="chat-stream" class="flex-1 overflow-y-auto px-5 py-3 space-y-2.5 bg-white">
          <!-- Populated by JS -->
        </div>

        <!-- Fixed Bottom Input Bar -->
        <form onsubmit="handleChatSubmit(event)" class="px-5 py-2.5 border-t border-slate-200 bg-slate-50 flex items-center gap-2.5 shrink-0">
          <input
            id="chat-input"
            type="text"
            placeholder="Ask ADK (e.g., 'Which closure does the most damage?', 'What does $8,000 change?', 'Un-applied bottlenecks?', 'Write Friday memo')..."
            class="flex-1 px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs text-slate-900 focus:outline-none focus:border-slate-900"
          />
          <button
            type="submit"
            class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shrink-0 transition-colors"
          >
            Send
          </button>
        </form>
      </section>

    </main>

    function renderSvg(entity) {
      const hopX = { 0: 85, 1: 250, 2: 415, 3: 575 };
      const nodes = entity.nodes || [];
      const seed = nodes.find(n => n.hop === 0) || nodes[0];

      let edgesSvg = "";
      nodes.forEach(n => {
        if (n.hop > 0) {
          const parents = n.parent
            ? [nodes.find(p => p.id === n.parent) || seed]
            : nodes.filter(p => p.hop === 0);

          parents.forEach(parent => {
            const x1 = hopX[parent.hop] + 60;
            const y1 = parent.y;
            const x2 = hopX[n.hop] - 60;
            const y2 = n.y;
            const stroke = n.verified ? "#059669" : "#f59e0b";
            const dash = n.verified ? "" : 'stroke-dasharray="5,5" class="edge-animated"';

            edgesSvg += `<path d="M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="2.2" ${dash} />`;
          });
        }
      });

      const nodesSvg = nodes.map(n => {
        const cx = hopX[n.hop];
        const cy = n.y;
        let fill = "#ffffff", stroke = "#0f172a";
        if (n.type === "seed") { fill = "#ecfdf5"; stroke = "#059669"; }
        if (n.type === "leaf") { fill = "#eff6ff"; stroke = "#2563eb"; }
        if (n.type === "blocked") { fill = "#fff1f2"; stroke = "#e11d48"; }
        if (n.type === "bottleneck") { fill = "#fffbeb"; stroke = "#d97706"; }

        return `
          <g transform="translate(${cx - 60}, ${cy - 22})">
            <rect width="120" height="44" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.8" />
            <text x="60" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">${n.name}</text>
            <text x="60" y="33" text-anchor="middle" font-size="9.5" fill="#64748b">${n.sub}</text>
          </g>
        `;
      }).join("");

      return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 flex flex-col justify-between h-full">
          <div class="flex items-center justify-between text-xs mb-2">
            <span class="font-bold text-slate-800">Cascade Graph (Hop 0 → Hop 3)</span>
            <div class="flex items-center gap-3 text-slate-500">
              <span class="flex items-center gap-1"><span class="w-4 h-0.5 bg-emerald-600 inline-block"></span>Measured</span>
              <span class="flex items-center gap-1"><span class="w-4 h-0.5 border-b-2 border-dashed border-amber-500 inline-block"></span>Modeled</span>
            </div>
          </div>
          <svg viewBox="0 0 660 230" class="w-full flex-1 bg-slate-50/70 rounded-lg border border-slate-100">
            ${edgesSvg}
            ${nodesSvg}
          </svg>
        </div>
      `;
    }

          agent: "Orchestrator",
          tool: `score_single_applicant('${cur.id}')`,
          text: `**${cur.name} (${cur.address})**: Award **$${cur.award.toLocaleString()}**, Runway **${cur.runway}**, Survival Lift **${cur.lift10k}**. ${cur.oneLiner}`
        };
      }

      chatMessages.push(reply);
      renderAll();
    }

    function renderAll() {
      renderSidebar();
      renderInfoPane();
      renderChat();
    }

    renderAll();
  </script>
</body>
</html>
